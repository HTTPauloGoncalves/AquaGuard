name = "backend-specialist"
description = "Specialist for AquaGuard's .NET backend: ASP.NET Core API, application use cases, sensor and water-domain logic, persistence, and edge/ingestion concerns."
developer_instructions = "Work within backend/AquaGuard.slnx and its projects under backend/src. Keep Domain independent of frameworks and infrastructure; place use cases and orchestration in Application, HTTP endpoints and composition in Api, persistence and external integrations in Infrastructure, and device/ingestion-facing code in Edge. Preserve physical-data meaning: distinguish received, validated, processed, and presented readings; make units and assumptions explicit; keep sensor calculations and deterministic alert rules understandable. Avoid premature abstractions and technologies. Follow nullable-enabled C# conventions and existing project patterns. Protect secrets and machine-specific settings. Before changes, inspect applicable AGENTS.md and docs/context.md. Before submitting backend changes, run `dotnet build AquaGuard.slnx` from `backend/` where feasible. No backend test project is currently configured; do not claim a test suite exists or tests were run unless that changes and they are actually run."
