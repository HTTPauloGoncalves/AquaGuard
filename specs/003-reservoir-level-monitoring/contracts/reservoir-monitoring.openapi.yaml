openapi: 3.1.0
info:
  title: AquaGuard Reservoir Monitoring API
  version: 1.0.0
  description: >-
    Contrato local da feature de monitoramento. O endpoint de ingestão aceita somente a fonte
    simulada nesta fase. Horários são instantes ISO 8601 com offset e retornos usam UTC.
servers:
  - url: http://localhost:5080/api/v1
    description: API local da demonstração; portas reais ficam na configuração de desenvolvimento.
paths:
  /simulated-measurements:
    post:
      operationId: receiveSimulatedMeasurement
      summary: Registrar um recebimento do simulador
      description: >-
        Campos semânticos inválidos em JSON válido são preservados como recebimentos inválidos.
        JSON malformado, chave de idempotência ausente ou reservatório desconhecido são recusados.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulatedMeasurementInput'
      responses:
        '202':
          description: Recebimento novo registrado, válido ou inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasurementReceiptResult'
        '200':
          description: Repetição idempotente; o resultado previamente registrado é retornado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasurementReceiptResult'
        '400':
          description: JSON malformado ou chave de idempotência inválida/ausente
        '404':
          description: Reservatório não encontrado
        '409':
          description: Chave de idempotência reutilizada com payload diferente
  /reservoirs/{reservoirId}/level-monitoring:
    get:
      operationId: getReservoirLevelMonitoring
      summary: Consultar nível atual, histórico, variação e contexto opcional de precipitação
      parameters:
        - in: path
          name: reservoirId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: from
          description: Início inclusivo do histórico, ISO 8601 com offset; default é agora menos 24h
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          description: Fim inclusivo do histórico, ISO 8601 com offset; default é agora
          schema:
            type: string
            format: date-time
        - in: query
          name: includePrecipitation
          description: Inclui a série separada de precipitação quando true
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Dados do intervalo solicitado; latestValid é independente do intervalo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LevelMonitoringResponse'
        '400':
          description: Intervalo inválido, inclusive from posterior a to
        '404':
          description: Reservatório não encontrado
components:
  schemas:
    SimulatedMeasurementInput:
      type: object
      required: [reservoirId]
      properties:
        reservoirId:
          type: string
          format: uuid
        kind:
          type: string
          description: Tipo canônico water_level ou precipitation; outro tipo é inválido semanticamente.
        # Os campos semânticos são opcionais no contrato para permitir registrar recebimentos JSON
        # estruturalmente válidos, mas incompletos, como inválidos em vez de descartá-los.
        value:
          description: Valor recebido; tipo não numérico é preservado e classificado como inválido.
          oneOf:
            - type: number
            - type: string
            - type: 'null'
        unit:
          type: [string, 'null']
        measuredAt:
          description: Instante ISO 8601 declarado; string sem fuso ou não interpretável resulta em inválido.
          type: [string, 'null']
        accumulationStart:
          type: [string, 'null']
        accumulationEnd:
          type: [string, 'null']
    MeasurementReceiptResult:
      type: object
      required: [receiptId, sourceEventId, source, receivedAt, validationStatus, validationMessages]
      properties:
        receiptId:
          type: string
          format: uuid
        sourceEventId:
          type: string
          format: uuid
        source:
          type: string
          const: simulated
        receivedAt:
          type: string
          format: date-time
        validationStatus:
          type: string
          enum: [valid, invalid]
        validationMessages:
          type: array
          items:
            type: string
    LevelMonitoringResponse:
      type: object
      required: [reservoirId, window, latestValid, history, variation]
      properties:
        reservoirId:
          type: string
          format: uuid
        window:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        latestValid:
          oneOf:
            - $ref: '#/components/schemas/LevelMeasurement'
            - type: 'null'
        history:
          type: array
          items:
            $ref: '#/components/schemas/LevelMeasurement'
        variation:
          oneOf:
            - $ref: '#/components/schemas/LevelVariation'
            - type: 'null'
        precipitation:
          type: array
          description: Série contextual separada; null/ausente indica não solicitada, array vazio indica sem dados.
          items:
            $ref: '#/components/schemas/PrecipitationMeasurement'
    LevelMeasurement:
      type: object
      required: [value, unit, measuredAt, source]
      properties:
        value: { type: number }
        unit: { type: string, const: m }
        measuredAt: { type: string, format: date-time }
        source: { type: string, const: simulated }
    LevelVariation:
      type: object
      required: [deltaMeters, startMeasuredAt, endMeasuredAt, direction]
      properties:
        deltaMeters: { type: number }
        startMeasuredAt: { type: string, format: date-time }
        endMeasuredAt: { type: string, format: date-time }
        direction:
          type: string
          enum: [rising, falling, no_observed_change]
    PrecipitationMeasurement:
      type: object
      required: [value, unit, accumulationStart, accumulationEnd, source]
      properties:
        value: { type: number, minimum: 0 }
        unit: { type: string, const: mm }
        accumulationStart: { type: string, format: date-time }
        accumulationEnd: { type: string, format: date-time }
        source: { type: string, const: simulated }
